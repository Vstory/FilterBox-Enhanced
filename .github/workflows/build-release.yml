name: Build · Release

# 正式版渠道：**只手动触发**，只认 main 的最新提交，tag `v<版本>.<code>`、每版一个独立页面。
# ⚠️ 刻意不挂 push：合并代码就自动吐出一个正式包，等于把未经确认的代码当成已发布版本。
#    测试版请走 build-ci.yml（push 任意分支即出包，固定 tag `ci`）。
# 正文优先取仓库内 `.github/release-notes/v<版本>.<code>.md` 并**原样**发布 —— 故可先写好文件、
# 提交推送、再触发，页面内容就等于文件内容（正文可控可核对）；缺失时回退为 CI 自动生成。
run-name: "Build · Release · ${{ github.ref_name }}"

on:
  workflow_dispatch:

# 与本仓库的 CI 渠道自成一组：tag 由版本号决定，与 ci 页无交集。
concurrency:
  group: build-release
  cancel-in-progress: false

permissions:
  contents: write   # 发布 Release 需要写权限

# 供应链加固：第三方 action 一律钉 commit SHA（可变 tag 被上游改动/账号被盗后有投毒风险）。
# SHA 取自 AppErrorNotify 现役工作流（同账号、已实测跑通），不手写 tag。
env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      # 守卫要比对 origin/main，故必须取回完整历史/远端引用
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # 两条守卫，都在编译之前（失败只花几秒）：
      #   ① 只认 main —— dispatch 的分支下拉框可挑任意分支/标签，从特性分支误触发会把尚未验证
      #      的代码发成正式包。
      #   ② 必须是 main 的**最新**提交 —— 检出用的是派发时解析的 SHA，若 main 在「派发 → 检出」
      #      之间前进，构建出的就是稍旧的提交，而页面上的 commit 链接指向派发时的 SHA ⇒ 等于页面撒谎。
      - name: Guard release against ref
        run: |
          echo "触发 ref: ${GITHUB_REF}"

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::正式版只能从 main 触发，当前是 ${GITHUB_REF}"
            exit 1
          fi

          HEAD_SHA="$(git rev-parse HEAD)"
          # 显式拉一次：push 事件下 checkout 不保证建立 origin/main 这个 remote-tracking ref，
          # 光靠它比对，守卫会在最该生效的时候落空（读到空值即放行/报错含糊）。
          git fetch --no-tags origin main:refs/remotes/origin/main >/dev/null 2>&1 || true
          MAIN_SHA="$(git rev-parse origin/main 2>/dev/null || true)"
          if [ -z "${MAIN_SHA}" ]; then
            echo "::error::读不到 origin/main，无法确认是否为最新提交 —— 拒绝发布"
            exit 1
          fi
          if [ "${HEAD_SHA}" != "${MAIN_SHA}" ]; then
            echo "::error::main 已前进（检出 ${HEAD_SHA:0:8}，main 现在 ${MAIN_SHA:0:8}），请重新触发"
            exit 1
          fi
          echo "✅ 正式版基于 main 最新提交 ${HEAD_SHA:0:8}"

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # Android SDK：项目 compileSdk=37 + buildToolsVersion=37.0.0，runner 预装镜像里没有。
      #   ⚠️ platform-37 在官方仓库里是**带小数**的名字（platforms;android-37.2），
      #   `platforms;android-37` 不存在；而 AGP 按 compileSdk=37 找的是 platforms/android-37
      #   目录 ⇒ 装完必须归位目录名。
      - name: Set up Android SDK 37
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          echo "SDK=$SDK"
          echo "sdkmanager=$SDKM"

          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" "build-tools;37.0.0" >/dev/null 2>&1 \
            || sudo "$SDKM" "build-tools;37.0.0" >/dev/null 2>&1 || true

          if [ ! -f "$SDK/platforms/android-37/android.jar" ]; then
            echo "安装 platform 37（手动解压 + 归位目录名）"
            curl -fsSL -o /tmp/platform-37.zip \
              "https://dl.google.com/android/repository/platform-37.2_r01.zip"
            rm -rf /tmp/p37 && mkdir -p /tmp/p37
            unzip -q /tmp/platform-37.zip -d /tmp/p37
            sudo mkdir -p "$SDK/platforms"
            sudo rm -rf "$SDK/platforms/android-37"
            sudo mv /tmp/p37/android-37.2 "$SDK/platforms/android-37"
          fi

          test -f "$SDK/platforms/android-37/android.jar" \
            || { echo "::error::platforms/android-37 就位失败"; exit 1; }
          test -x "$SDK/build-tools/37.0.0/aapt2" \
            || { echo "::error::build-tools 37.0.0 就位失败"; exit 1; }
          echo "platforms: $(ls "$SDK/platforms" | tr '\n' ' ')"
          echo "build-tools: $(ls "$SDK/build-tools" | tr '\n' ' ')"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Compute build info
        id: info
        run: |
          echo "short=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"
          echo "ts=$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"

      # tag / 页面名 / 产物名集中在编译之前：tag 冲突只花几秒就能拦下。
      # ⚠️ 目标 tag 已存在 → 直接失败：同 tag 重发会把整页正文与附件覆盖掉（历史正式版页可能带
      #    手写 notes），要重发请先 bump versionCode。
      # 命名：<应用名>.<版本>.<code>.release.apk（与 CI 渠道的 …_<时间>_ci-debug_<短号>.apk 一眼可分）
      - name: Resolve release target and APK name
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL_REF="$(sed -nE 's/.*android:label="([^"]+)".*/\1/p' app/src/main/AndroidManifest.xml | head -1)"
          case "$LABEL_REF" in
            @string/*)
              KEYNAME="${LABEL_REF#@string/}"
              LABEL="$(sed -nE "s#.*<string name=\"${KEYNAME}\">([^<]*)</string>.*#\1#p" \
                       app/src/main/res/values/strings.xml 2>/dev/null | head -1)"
              ;;
            *) LABEL="$LABEL_REF" ;;
          esac
          [ -n "$LABEL" ] || { echo "::error::读不到应用名（AndroidManifest 的 android:label）"; exit 1; }
          PREFIX="$(printf '%s' "$LABEL" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//; s/[[:space:]]+/./g')"
          case "$PREFIX" in
            ""|*[!A-Za-z0-9._-]*|.*|*.)
              echo "::error::产物名前缀为空或含非法字符：'$PREFIX'（仅允许字母/数字/._-）"; exit 1 ;;
          esac

          VER="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$VER" ] || [ -z "$CODE" ]; then
            echo "::error::读不到 versionName/versionCode（app/build.gradle.kts）"
            exit 1
          fi

          TAG="v${VER}.${CODE}"
          # 只把 404 当作「tag 不存在」；其余失败（网络抖动、token 权限不足）一律拒绝发布 ——
          # 若把「查不到」与「查不动」混为一谈，一次 API 抖动就能静默覆盖掉已有正式版页面。
          if PROBE="$(gh api -H "Accept: application/vnd.github+json" \
               "repos/${{ github.repository }}/releases/tags/${TAG}" 2>&1)"; then
            echo "::error::tag ${TAG} 已存在 —— 同一版本不得重发（会覆盖该页正文与附件）。请先 bump versionCode。"
            exit 1
          fi
          case "$PROBE" in
            *"HTTP 404"*|*"Not Found"*) ;;
            *) echo "::error::无法确认 tag ${TAG} 是否已存在（gh api 报错且非 404）—— 拒绝发布以免覆盖已有页面"
               printf '%s\n' "$PROBE"; exit 1 ;;
          esac

          APK_NAME="${PREFIX}.${VER}.${CODE}.release.apk"
          {
            echo "tag=${TAG}"
            echo "name=v${VER} (${CODE})"
            echo "prerelease=false"
            echo "make_latest=true"
          } >> "$GITHUB_OUTPUT"
          echo "→ tag=${TAG}（正式版，每版一页）  产物名：${APK_NAME}"
          for kv in "PREFIX=$PREFIX" "VER=$VER" "CODE=$CODE" "APK_NAME=$APK_NAME"; do echo "${kv}" >> "$GITHUB_ENV"; done

      # 签名：从仓库 secrets 解码**固定密钥**（公用钥，见 tokens/Signing/）到 `ci-signing.jks`。
      #   ⚠️ 4 个 secret 是配套的一组，改名要四处同改：本处与 build-ci.yml、
      #      tokens/Signing/scripts/sync-signing-secrets.py 的 SECRET_FROM_KEY、
      #      tokens/Signing/README.md、知识库 凭证运维/README.md。
      #   ⚠️ secret 一律经 env 传入、run 里只引用变量名 —— 不把 ${{ secrets.X }} 写进 run 正文：
      #      值里若含 `$` 或反引号会被 shell 二次展开，且在签名报错前毫无提示。
      #   ⚠️ 缺 secret 时**直接失败**：本项目的 build.gradle.kts 在无 local.properties 时**不报错**，
      #      而是产出 `app-release-unsigned.apk` —— 「构建成功、包装不上」要等用户下载才发现。
      - name: Prepare signing (fixed key from secrets)
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for v in KEY_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少签名 secret:$missing —— 拒绝回退（那会让产物无法覆盖升级）"
            exit 1
          fi

          KS="$GITHUB_WORKSPACE/ci-signing.jks"
          printf '%s' "$KEY_BASE64" | base64 -d > "$KS"

          keytool -list -keystore "$KS" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1 \
            || { echo "::error::密钥库打不开或别名不存在 —— 核对 KEY_BASE64 / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS"; exit 1; }
          echo "已校验：密钥库可打开、别名存在"

          {
            printf 'storeFile=%s\n' "$KS"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } >> local.properties
          echo "已按固定密钥配置签名"

      - name: Gradle build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          ls -la app/build/outputs/apk/release

      - name: Rename APK and assert naming rule
        run: |
          SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            if [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
              echo "::error::产物未签名（出现 app-release-unsigned.apk）—— signingConfig 没生效"
            else
              echo "::error::未找到产物：$SRC"
            fi
            exit 1
          fi

          mkdir -p dist
          cp -- "$SRC" "dist/${APK_NAME}"
          echo "产物: dist/${APK_NAME} ← $SRC"

          RE='^[A-Za-z0-9._-]+\.release\.apk$'
          shopt -s nullglob
          apks=(dist/*.apk)
          [ "${#apks[@]}" -eq 1 ] || { echo "::error::应产出 1 个包，实际 ${#apks[@]} 个"; exit 1; }
          for f in "${apks[@]}"; do
            printf '%s' "$(basename "$f")" | grep -qE "$RE" \
              || { echo "::error::产物名与规则不符: $(basename "$f")"; exit 1; }
          done
          echo "✅ 命名自检通过"
          ls -la dist

      # 断言产物真的可用：三件套 + 作用域 + **入口类在 dex 里**（release 走了 R8 ⇒ 这条最关键）
      #   + **不是 debug 变体** + 版本号未漂移 + **真的被固定密钥签过**。全是静默失败模式。
      - name: Verify APK (xposed files + scope + dex entry + signature + version)
        run: |
          APKSIGNER="$(command -v apksigner || true)"
          [ -n "$APKSIGNER" ] || APKSIGNER="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          [ -n "$APKSIGNER" ] || { echo "::error::找不到 apksigner，无法断言签名 —— 拒绝发布"; exit 1; }
          AAPT2="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)"
          [ -n "$AAPT2" ] || { echo "::error::找不到 aapt2（用于读版本与 debuggable 标志）"; exit 1; }

          # 固定密钥的证书指纹（SHA-256，大写无冒号）。**换密钥时必须同步改本行**
          # （取法：keytool -list -v 里的 SHA256，去冒号转大写）。
          EXPECTED_CERT_SHA256="8D1B6022D3E3BB837A3BA1870E0EEAC8650F9470B8287EDF549DACEC9E9E2A64"

          APK="$(ls dist/*.apk)"
          NAME="$(basename "$APK")"
          echo "════ 校验 $NAME"

          MISSING=""
          for e in META-INF/xposed/java_init.list META-INF/xposed/module.prop META-INF/xposed/scope.list; do
            unzip -l "$APK" | grep -q "$e" || MISSING="$MISSING $e"
          done
          [ -z "$MISSING" ] || { echo "::error::$NAME 缺 libxposed 三件套:$MISSING（LSPosed 不会识别为模块）"; exit 1; }
          echo "  ✅ META-INF/xposed 三件套齐全"

          SCOPE="$(unzip -p "$APK" META-INF/xposed/scope.list | grep -vE '^[[:space:]]*#' | tr -d '[:space:]')"
          [ -n "$SCOPE" ] || { echo "::error::$NAME 的 scope.list 为空（作用域失效）"; exit 1; }
          unzip -p "$APK" META-INF/xposed/module.prop | grep -q '^staticScope=true$' \
            || { echo "::error::$NAME 的 module.prop 缺 staticScope=true（作用域需手动勾选）"; exit 1; }
          echo "  ✅ 作用域静态声明有效（scope=$SCOPE）"
          echo "SCOPE=$SCOPE" >> "$GITHUB_ENV"

          # ⚠️ 入口类必须真在 dex 里，且与 java_init.list 写的名字一致。release 走了 R8（minify），
          #    这是本工作流**唯一**能拦住「proguard-rules 漏 keep ⇒ 入口类被改名/裁剪 ⇒ 模块静默
          #    不生效」的地方；debug 渠道无混淆，本断言只是顺带。
          ENTRY="$(unzip -p "$APK" META-INF/xposed/java_init.list | grep -vE '^[[:space:]]*#' | grep -vE '^[[:space:]]*$' | head -1 | tr -d '[:space:]')"
          [ -n "$ENTRY" ] || { echo "::error::$NAME 的 java_init.list 里没有入口类"; exit 1; }
          ENTRY_DESC="L$(printf '%s' "$ENTRY" | tr '.' '/');"
          FOUND=0
          for d in $(unzip -l "$APK" | awk '$4 ~ /^classes[0-9]*\.dex$/ {print $4}'); do
            if unzip -p "$APK" "$d" | grep -qaF "$ENTRY_DESC"; then FOUND=1; break; fi
          done
          [ "$FOUND" -eq 1 ] || { echo "::error::$NAME 的入口类 $ENTRY（$ENTRY_DESC）不在任何 dex 里 —— R8 裁剪或改名，模块不会加载（查 app/proguard-rules.pro 的 -keep）"; exit 1; }
          echo "  ✅ 入口类在 dex 中：$ENTRY"

          BADGING="$("$AAPT2" dump badging "$APK" 2>/dev/null || true)"

          # ⚠️ 每个 `VAR="$(... | grep ...)"` 都带 `|| true`：grep 无匹配返回 1，在 Actions 的
          #    `bash -e` 下会让赋值语句整体失败 ⇒ 脚本静默退出（日志只剩 "exit code 1."）。
          PKG_LINE="$(printf '%s' "$BADGING" | grep -m1 "^package:" || true)"
          [ -n "$PKG_LINE" ] || { echo "::error::$NAME 读不到 badging 的 package 行"; exit 1; }
          printf '%s' "$PKG_LINE" | grep -q "versionCode='${CODE}'" \
            || { echo "::error::$NAME 的 versionCode 与源码不符（期望 ${CODE}）：$PKG_LINE"; exit 1; }
          printf '%s' "$PKG_LINE" | grep -q "versionName='${VER}'" \
            || { echo "::error::$NAME 的 versionName 与源码不符（期望 ${VER}）：$PKG_LINE"; exit 1; }
          echo "  ✅ 版本号与源码一致：${VER}(${CODE})"

          # 正式包不得是 debuggable —— 出现该标志说明构建用了 debug 变体（日志未裁剪、非最终形态）
          if printf '%s' "$BADGING" | grep -q "^application-debuggable$"; then
            echo "::error::$NAME 是 debug 变体（badging 含 application-debuggable）—— 确认构建任务用的是 assembleRelease"
            exit 1
          fi
          echo "  ✅ 非 debug 变体"

          OUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1 || true)"
          if printf '%s' "$OUT" | grep -qi 'DOES NOT VERIFY\|Missing.*signature\|no signature'; then
            echo "::error::$NAME 未通过签名校验 —— 拒绝发布"
            printf '%s\n' "$OUT"
            exit 1
          fi
          DIGEST="$(printf '%s' "$OUT" | sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-fA-F]+).*$/\1/p' | head -1)"
          [ -n "$DIGEST" ] || { echo "::error::$NAME 读不到签名证书指纹（apksigner 未能解析产物）"; printf '%s\n' "$OUT"; exit 1; }
          ACTUAL="$(printf '%s' "$DIGEST" | tr -d ':' | tr 'a-f' 'A-F')"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::$NAME 签名指纹与固定密钥不符 —— 拒绝发布"
            echo "  期望: $EXPECTED_CERT_SHA256"
            echo "  实际: $ACTUAL"
            echo "  排查：① 仓库 secrets 的 KEY_BASE64 是否被清空/写错 ② 若确已轮换密钥，本处期望值需同步更新"
            exit 1
          fi
          echo "  ✅ 签名有效，指纹与固定密钥一致：$ACTUAL"

          VERBOSE="$("$APKSIGNER" verify --verbose "$APK" 2>&1 || true)"
          for scheme in v2 v3; do
            printf '%s' "$VERBOSE" | grep -qE "Verified using ${scheme} scheme.*: true" \
              || { echo "::error::$NAME 未启用 ${scheme} 签名方案 —— 拒绝发布"; printf '%s\n' "$VERBOSE"; exit 1; }
          done
          echo "  ✅ 签名方案含 v2 + v3"

          echo "CERT_SHA256=$ACTUAL" >> "$GITHUB_ENV"
          echo "SIGN_SCHEMES=v2+v3" >> "$GITHUB_ENV"

      # 正文：人工文件**原样**发布，不加任何自动内容 —— 历史正式版页可能是纯双语 changelog，
      #   而正文的用途是让用户在触发前先确认「页面会写什么」，加了料这句就落空了。
      # 文件名带版本：否则忘更新文件时，新版页会静默沿用上一版 notes。
      - name: Generate release body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          BODY="${GITHUB_WORKSPACE}/release_body.md"
          MANUAL="${GITHUB_WORKSPACE}/.github/release-notes/v${VER}.${CODE}.md"

          if [ -s "$MANUAL" ]; then
            cp -- "$MANUAL" "$BODY"
            echo "✅ 正文取自人工文件（原样发布）：.github/release-notes/v${VER}.${CODE}.md"
            echo "=== release 正文 ==="
            cat "$BODY"
            exit 0
          fi

          TS="${{ steps.info.outputs.ts }}"
          SHORT="${{ steps.info.outputs.short }}"
          PRETTY="${TS:0:4}-${TS:4:2}-${TS:6:2} ${TS:9:2}:${TS:11:2}"
          MB="$(awk -v b="$(stat -c %s "dist/${APK_NAME}")" 'BEGIN{printf "%.1f", b/1048576}')"
          echo "::notice::未找到 .github/release-notes/v${VER}.${CODE}.md（或为空）—— 正文回退为自动生成"

          {
            echo "> [!NOTE]"
            echo "> **本页面为手动构建的正式版**：固定密钥签名，可直接覆盖升级。"
            echo "> 自动构建的测试版见 [CI Build](https://github.com/${REPO}/releases/tag/ci)。"
            echo ">"
            echo "> ⓘ 本页正文由 CI 自动生成 —— 未提供人工正文 \`.github/release-notes/v${VER}.${CODE}.md\`。"
            echo
            echo "正式版 · \`${VER}(${CODE})\` · commit [\`${SHORT}\`](https://github.com/${REPO}/commit/${{ github.sha }})"
            echo
            echo "## 📥 下载 · ${PRETTY}（北京时间）"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 产物 | [\`${APK_NAME}\`](https://github.com/${REPO}/releases/download/v${VER}.${CODE}/${APK_NAME}) |"
            echo "| 变体 | release（R8 已裁剪，无调试日志） |"
            echo "| 大小 | ${MB} MB |"
            echo "| 签名 | ${SIGN_SCHEMES:-（未读取到）} · \`${CERT_SHA256:-（未读取到）}\` |"
            echo "| 作用域 | \`${SCOPE}\`（已在 \`META-INF/xposed/scope.list\` 静态声明，LSPosed 里无需手动勾选） |"
            echo "| 构建来源 | [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo
            echo "- 正式包**不带**调试日志（\`BuildConfig.DEBUG=false\` 在编译期裁掉）；排障请改用"
            echo "  [CI Build](https://github.com/${REPO}/releases/tag/ci) 页的 debug 包。"
            echo
            echo "---"
            echo "文件名规则 = \`<应用名>.<版本>.<code>.release.apk\`；tag = \`v<版本>.<code>\`，每版一页、不清理。"
          } > "$BODY"

          echo "=== 生成的 release 说明 ==="
          cat "$BODY"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FilterBox-Enhanced-release-${{ steps.info.outputs.ts }}-${{ steps.info.outputs.short }}-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: ${{ steps.target.outputs.name }}
          prerelease: ${{ steps.target.outputs.prerelease }}
          make_latest: ${{ steps.target.outputs.make_latest }}
          body_path: release_body.md
          files: dist/*.apk
